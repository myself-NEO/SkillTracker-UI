<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="border" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="stroke" x1="18" y1="48" x2="46" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="16" stroke="url(#border)" stroke-width="1.5" opacity="0.6"/>

  <!-- "N" monogram, its rising diagonal doubling as a level-up stroke -->
  <path d="M18 16L18 46M18 46L46 16M46 16L46 46" stroke="url(#stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Level-up chevron -->
  <path d="M27 10L32 5L37 10" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<div class="login-container">
  <!-- Ambient background elements -->
  <div class="blur-circle-1"></div>
  <div class="blur-circle-2"></div>

  <div class="glass-card">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-3 bg-indigo-500/20 border border-indigo-500/30 rounded-2xl mb-4 text-indigo-300 shadow-lg">
        <svg lucideLock class="w-8 h-8"></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">
        SDE 2 Prep Workspace
      </h1>
      <p class="text-slate-400 text-sm mt-1">
        Accelerate your senior engineering prep journey
      </p>
    </div>

    <!-- Error Alert Box -->
    <div *ngIf="error" 
         class="mb-6 p-4 bg-rose-950/40 border border-rose-850/50 rounded-2xl flex items-start gap-3 text-rose-200 text-sm animate-fade-in">
      <svg lucideShield class="w-5 h-5 shrink-0 text-rose-400 mt-0.5"></svg>
      <span>{{ error }}</span>
    </div>

    <!-- Success Alert Box -->
    <div *ngIf="successMsg" 
         class="mb-6 p-4 bg-emerald-950/40 border border-emerald-850/50 rounded-2xl flex items-start gap-3 text-emerald-200 text-sm animate-fade-in">
      <svg lucideSparkles class="w-5 h-5 shrink-0 text-emerald-400 mt-0.5"></svg>
      <span>{{ successMsg }}</span>
    </div>

    <form (submit)="handleSubmit($event)" class="space-y-4">
      <!-- Full Name (Only when Registering) -->
      <div *ngIf="isRegister">
        <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">
          Full Name
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <svg lucideUser class="w-4 h-4"></svg>
          </span>
          <input
            type="text"
            required
            name="fullName"
            placeholder="e.g. Keshav Kumar Jha"
            [(ngModel)]="fullName"
            class="w-full bg-white/5 border border-white/10 placeholder-slate-500 rounded-xl py-3 pl-11 pr-4 text-white text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all"
          />
        </div>
      </div>

      <!-- Email Input -->
      <div>
        <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">
          Email Address
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <svg lucideUserCheck class="w-4 h-4"></svg>
          </span>
          <input
            type="email"
            required
            name="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            class="w-full bg-white/5 border border-white/10 placeholder-slate-500 rounded-xl py-3 pl-11 pr-4 text-white text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">
          Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <svg lucideLock class="w-4 h-4"></svg>
          </span>
          <input
            type="password"
            required
            name="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            class="w-full bg-white/5 border border-white/10 placeholder-slate-500 rounded-xl py-3 pl-11 pr-4 text-white text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition-all duration-200 text-sm shadow-lg shadow-indigo-600/20 mt-2 cursor-pointer"
      >
        {{ loading ? "Please wait..." : isRegister ? "Create Prep Account" : "Access Prep Workspace" }}
      </button>
    </form>

    <!-- Social Sign In Splitter -->
    <div class="relative my-6 flex items-center justify-center">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-white/10"></div>
      </div>
      <span class="relative bg-[#111625] px-3 text-slate-400 text-xs uppercase font-medium tracking-wider z-10 rounded-full">
        Or continue with
      </span>
    </div>

    <!-- Google Login Button -->
    <button
      type="button"
      (click)="handleGoogleLogin()"
      class="w-full bg-white/10 hover:bg-white/15 active:bg-white/20 text-white font-medium py-3 px-4 rounded-xl transition-all text-sm flex items-center justify-center gap-2.5 border border-white/10 shadow-md cursor-pointer"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.68 1.54 14.98 1 12 1 7.35 1 3.37 3.65 1.44 7.54l3.87 3C6.24 7.42 8.92 5.04 12 5.04z" />
        <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.44c-.28 1.47-1.11 2.71-2.36 3.55l3.66 2.84c2.14-1.97 3.38-4.88 3.38-8.54z" />
        <path fill="#34A853" d="M5.31 14.9c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28l-3.87-3C.53 9.07 0 10.48 0 12s.53 2.93 1.44 4.66l3.87-2.76z" />
        <path fill="#FBBC05" d="M12 18.96c-3.08 0-5.76-2.38-6.69-5.5l-3.87 2.76C3.37 20.35 7.35 23 12 23c2.99 0 5.61-.99 7.48-2.69l-3.66-2.84c-1.04.69-2.36 1.49-3.82 1.49z" />
      </svg>
      Sign in with Google
    </button>

    <!-- Register Switch Link -->
    <p class="text-center text-slate-400 text-xs mt-6">
      {{ isRegister ? "Already tracking your prep?" : "New to the SDE 2 path?" }}
      <button
        type="button"
        (click)="toggleView()"
        class="text-indigo-400 hover:text-indigo-300 font-bold underline cursor-pointer transition-all"
      >
        {{ isRegister ? "Sign In" : "Register Credentials" }}
      </button>
    </p>
  </div>
</div>

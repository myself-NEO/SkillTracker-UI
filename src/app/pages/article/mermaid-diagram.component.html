<figure
  class="not-prose overflow-hidden rounded-xl border border-border bg-code"
  [class.my-6]="!compact()"
  [attr.data-diagram]="state().status"
  [attr.data-diagram-type]="type()"
>
  @if (!compact()) {
    <figcaption class="flex flex-wrap items-center justify-between gap-2 border-b border-border px-4 py-1.5">
      <span class="min-w-0 text-xs font-semibold tracking-wider text-muted uppercase">{{ label() }}</span>
      <span class="flex flex-wrap items-center gap-0.5">
        @if (steps().length > 0 && current() < 0) {
          <button type="button" (click)="current.set(0)" class="mermaid-tool text-accent!">
            ▶ Step through ({{ steps().length }})
          </button>
        }
        <button
          type="button"
          (click)="openExpanded()"
          [disabled]="state().status !== 'ready'"
          class="mermaid-tool disabled:opacity-50"
          aria-haspopup="dialog"
        >
          ⤢ Expand
        </button>
        <button type="button" (click)="showText.set(!showText())" [attr.aria-pressed]="showText()" class="mermaid-tool">
          {{ showText() ? 'Hide text' : 'Text' }}
        </button>
        <button type="button" (click)="copySource()" class="mermaid-tool">
          <span aria-live="polite">{{ copied() ? 'Copied!' : 'Copy' }}</span>
        </button>
        @if (save()) {
          <button
            type="button"
            (click)="saveDiagram()"
            class="mermaid-tool"
            [attr.aria-label]="saved() ? 'Diagram saved to your notebook' : 'Save diagram to your notebook'"
          >
            <span aria-live="polite">{{ saved() ? 'Saved' : 'Save' }}</span>
          </button>
        }
      </span>
    </figcaption>
  }

  @if (current() >= 0) {
    <div
      class="flex flex-wrap items-center justify-between gap-2 border-b border-accent/20 bg-accent-soft px-4 py-2"
      role="group"
      aria-label="Step through the flow"
    >
      <p class="min-w-0 text-sm [overflow-wrap:anywhere] text-fg" aria-live="polite">
        <span class="font-semibold text-accent">Step {{ current() + 1 }} of {{ steps().length }}:</span>
        {{ steps()[current()]?.label }}
      </p>
      <span class="flex items-center gap-1">
        <button type="button" (click)="step(-1)" [disabled]="current() === 0" class="mermaid-tool disabled:opacity-40">
          ← Prev
        </button>
        <button
          type="button"
          (click)="step(1)"
          [disabled]="current() === steps().length - 1"
          class="mermaid-tool disabled:opacity-40"
        >
          Next →
        </button>
        <button type="button" (click)="current.set(-1)" class="mermaid-tool">Show all</button>
      </span>
    </div>
  }

  @switch (state().status) {
    @case ('loading') {
      <div class="flex min-h-32 items-center justify-center text-xs text-muted" role="status">Rendering diagram…</div>
    }
    @case ('error') {
      <div class="px-4 py-3" role="alert">
        <p class="mb-2 text-xs font-semibold text-warning">This diagram couldn’t be drawn. Its text is shown instead.</p>
        @if (compact()) {
          <!-- A preview beside its source (an editor): why, rather than the text again. -->
          <p class="mb-2 text-xs [overflow-wrap:anywhere] text-muted">{{ errorLine() }}</p>
        } @else {
          <pre class="overflow-x-auto font-mono text-[13px] leading-relaxed text-fg-soft" tabindex="0">{{ trimmed() }}</pre>
        }
      </div>
    }
  }
  <div
    class="overflow-x-auto"
    [class.px-3]="state().status === 'ready'"
    [class.py-4]="state().status === 'ready'"
    [class.hidden]="state().status !== 'ready'"
    [attr.tabindex]="state().status === 'ready' ? 0 : -1"
    [attr.aria-label]="label() + ' (scrollable)'"
  >
    <div #holder class="mx-auto w-fit max-w-full [&_svg]:mx-auto [&_svg]:h-auto"></div>
  </div>

  @if (showText()) {
    <pre
      class="overflow-x-auto border-t border-border px-4 py-3 font-mono text-[12.5px] leading-relaxed text-fg-soft"
      tabindex="0"
      >{{ trimmed() }}</pre
    >
  }

  <dialog
    #dialog
    [attr.aria-label]="label()"
    (click)="onDialogClick($event)"
    class="m-0 h-dvh max-h-none w-screen max-w-none bg-bg p-0 text-fg backdrop:bg-black/60"
  >
    <div class="flex h-full flex-col">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-border px-4 py-2">
        <p class="text-sm font-semibold text-fg">{{ label() }}</p>
        <span class="flex items-center gap-1">
          <button type="button" (click)="zoom.set(zoom() > 0.5 ? zoom() - 0.25 : 0.5)" class="mermaid-tool" aria-label="Zoom out">
            −
          </button>
          <span class="w-12 text-center text-xs text-muted" aria-live="polite">{{ zoomPercent() }}%</span>
          <button type="button" (click)="zoom.set(zoom() < 3 ? zoom() + 0.25 : 3)" class="mermaid-tool" aria-label="Zoom in">
            +
          </button>
          <button type="button" (click)="zoom.set(1)" class="mermaid-tool">Reset</button>
          <button type="button" (click)="closeExpanded()" class="mermaid-tool text-fg!" autofocus>Close ✕</button>
        </span>
      </div>
      <div class="flex-1 overflow-auto p-6">
        <div #dialogHolder class="mx-auto w-fit"></div>
      </div>
    </div>
  </dialog>
</figure>

@if (authService.loading()) {
  <!-- Synchronizing space loader -->
  <div class="min-h-screen bg-slate-950 flex flex-col items-center justify-center font-sans">
    <div class="flex flex-col items-center">
      <svg class="animate-spin h-8 w-8 text-indigo-500 mb-3" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-slate-400 text-xs font-semibold uppercase tracking-widest">
        Synchronizing SDE Space...
      </span>
    </div>
  </div>
} @else {
  @if (authService.currentUser(); as user) {
    <!-- Logged in tracker workspace layout -->
    <div class="min-h-screen bg-gradient-to-br from-[#0c0d19] via-[#090a0f] to-black text-slate-100 flex flex-col font-sans relative overflow-x-hidden">
      
      <!-- Decorative Background Elements -->
      <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-500 rounded-full blur-[120px] opacity-20 pointer-events-none"></div>
      <div class="absolute bottom-[-5%] right-[5%] w-[400px] h-[400px] bg-indigo-900 rounded-full blur-[100px] opacity-20 pointer-events-none"></div>
      
      <!-- Navbar component -->
      <app-navbar></app-navbar>

      <!-- Router Content Stage -->
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 z-10">
        <router-outlet></router-outlet>
      </main>

      <!-- Humble Footer -->
      <footer class="border-t border-white/10 bg-white/5 backdrop-blur-md py-6 text-center text-slate-400 text-[10px] uppercase font-bold tracking-wider z-10">
        <span>SDE 2 Interview Prep Tracker © 2026 • Frosted Glass High-Contrast Theme</span>
      </footer>

    </div>
  } @else {
    <!-- Not logged in: Show the Login View (Component rendered via routing) -->
    <div class="min-h-screen bg-gradient-to-br from-[#0c0d19] via-[#090a0f] to-black text-slate-100 flex flex-col font-sans relative overflow-x-hidden">
      <!-- Decorative Background Elements -->
      <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-500 rounded-full blur-[120px] opacity-25 pointer-events-none"></div>
      <div class="absolute bottom-[-5%] right-[5%] w-[400px] h-[400px] bg-indigo-900 rounded-full blur-[100px] opacity-25 pointer-events-none"></div>

      <main class="flex-1 z-10 flex items-center justify-center">
        <router-outlet></router-outlet>
      </main>
    </div>
  }
}
